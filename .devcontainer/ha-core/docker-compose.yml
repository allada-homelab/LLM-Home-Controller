services:
  ha-dev:
    build:
      context: ../..
      dockerfile: .devcontainer/ha-core/Dockerfile
    init: true
    volumes:
      - ../..:/workspace/LLM-Home-Controller:cached
      - ha-core:/workspace/ha-core
      - ha-config:/workspace/ha-config
      - ha-venv:/home/vscode/.local/ha-venv
      - uv-cache:/home/vscode/.cache/uv
    ports:
      - "8123:8123"
    environment:
      - PYTHONASYNCIODEBUG=1
    command: sleep infinity

  # OpenAI-compatible LLM backend for functional testing.
  # Swap this for llama-swap, vLLM, LiteLLM, etc. as needed.
  # From inside the ha-dev container, reach this at http://ollama:11434
  ollama:
    # ollama/ollama:0.30.0 — update digest when bumping the tag
    image: ollama/ollama:0.30.0@sha256:a5f42ba1af98f623a341f9f13140abce6b8ad2eacdc618338771aceb81b08668
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ha-core:
  ha-config:
  ha-venv:
  ollama-data:
  uv-cache:
