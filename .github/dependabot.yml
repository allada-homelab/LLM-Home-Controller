# Dependabot — auto-PRs for security advisories and routine version bumps.
#
# Supply-chain hardening:
#
#   1. NO AUTO-MERGE. There is no `auto-merge` field below, and no companion
#      workflow that auto-merges Dependabot PRs. Every PR is hand-reviewed.
#
#   2. Grouped minor + patch updates per-ecosystem so one PR covers a weekly
#      batch (fewer PRs to review). Weekly (not daily) cadence gives the
#      advisory feeds time to flag bad releases before a routine bump lands.
#
#   3. `open-pull-requests-limit` is capped per ecosystem so a flurry of bot
#      PRs never crowds out human work.
#
# Every PR uses `prefix: "chore"` + `include: "scope"`, so Dependabot renders
# `chore(deps): …` / `chore(deps-dev): …` titles — Conventional-Commits clean.
#
# Docker is scoped to the two dev-container Dockerfile dirs (there is no root
# Dockerfile). The ha-core Dockerfile itself uses floating tags Dependabot
# can't track — that's accepted.
#
# NO `uv` ecosystem: Dependabot's uv updater re-resolves the graph from
# scratch and backtracks into building homeassistant==0.7.0 (a 2015 sdist
# with a broken legacy setup.py) → dependency_file_not_resolvable, every
# scan. Python deps are managed manually (HA-pinned deps like PyTurboJPEG
# must track HA's versions anyway).

version: 2
updates:
  # GitHub Actions versions in our workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "deps"
      - "needs-review"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # Devcontainer base image + features.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "deps"
      - "needs-review"
    groups:
      devcontainers-minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker base images in the dev-container Dockerfiles (no root Dockerfile).
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/.devcontainer/ha-core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "deps"
      - "needs-review"
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]
